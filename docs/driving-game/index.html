<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
    <meta name="theme-color" content="#bde4f0">
    <title>Paseo Costero</title>
    <link rel="tv-game-manifest" href="./game.json">
    <link rel="stylesheet" href="./style.css?v=contact-1">
</head>
<body>
    <main aria-label="Paseo Costero">
        <canvas id="view" aria-hidden="true"></canvas>
        <div class="location-hud">
            <div class="location"><span class="game-title">Paseo Costero</span><strong id="district"></strong><time id="drive-time" datetime="PT0S" aria-label="Tiempo de conducción">00:00</time></div>
            <div class="audio-controls">
                <button id="unlock-audio" hidden>Activar audio</button>
                <button id="radio" aria-label="Cambiar de emisora" hidden></button>
            </div>
        </div>
        <div class="vehicle-hud">
            <div class="speed"><strong id="speed">0</strong><span>km/h</span></div>
            <div id="health" hidden><label for="condition">♥ Vida</label><strong id="health-value"></strong><progress id="condition" max="100" value="100"></progress></div>
            <div class="compass" aria-label="Brújula"><span class="compass-dial" aria-hidden="true"><span id="north-needle"></span></span><strong id="heading">N</strong></div>
        </div>
        <canvas id="minimap" width="192" height="192" aria-label="Minimapa, con el norte arriba"></canvas>
        <p id="notice" role="status" hidden><span id="notice-text"></span><span class="reward-stars" aria-hidden="true"><span>✦</span><span>★</span><span>✦</span></span></p>
        <section class="overlay" id="pause-screen" aria-label="Pausa" hidden>
            <div class="panel">
                <h1>En pausa</h1>
                <button id="resume">Continuar</button>
                <p class="hint">Start para reanudar</p>
            </div>
        </section>
        <section class="overlay" id="menu" aria-label="Menú del juego" hidden>
            <div class="panel">
                <h1>Configuración</h1>
                <div class="choices">
                    <button data-action="continue">Continuar</button>
                    <button data-action="speed"></button>
                    <button data-action="damage"></button>
                    <button data-action="sound"></button>
                    <button data-action="minimap"></button>
                    <button data-action="controller" hidden>Usar mando físico</button>
                    <button data-action="restart">Reiniciar</button>
                    <button data-action="catalog" hidden>Salir al catálogo</button>
                </div>
                <p class="hint" id="menu-hint">← → Elegir · × Aceptar · Select Volver</p>
            </div>
        </section>
        <section class="overlay" id="wreck-screen" aria-label="Coche averiado" hidden>
            <div class="panel">
                <h1>Coche averiado</h1>
                <button id="restart-wreck">Reiniciar</button>
                <p class="hint">Pulsa × para volver a empezar</p>
            </div>
        </section>
        <section class="overlay" id="error" aria-label="Error de gráficos" hidden>
            <div class="panel">
                <h1>No se pudo abrir el juego en 3D</h1>
                <p>Este dispositivo no tiene gráficos WebGL disponibles.</p>
                <button id="error-exit" hidden>Salir al catálogo</button>
            </div>
        </section>
    </main>
    <script type="module" src="./drive.js?v=contact-1"></script>
</body>
</html>
