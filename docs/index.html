<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101822">
  <title>Link Arcade</title>
  <link rel="stylesheet" href="./arcade.css">
  <script type="module" src="./catalog.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="./"><span aria-hidden="true">✦</span> Link Arcade</a>
    <nav class="top-links" aria-label="Project links">
      <a id="android" href="https://github.com/carlosalbaladejo/link-arcade/releases/latest">Download for Android</a>
      <a class="github-link" href="https://github.com/carlosalbaladejo/link-arcade" aria-label="View the Link Arcade repository on GitHub" title="View on GitHub">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
          <path d="M12 1C5.923 1 1 5.923 1 12c0 4.867 3.149 8.979 7.521 10.436.55.096.756-.233.756-.522 0-.262-.013-1.128-.013-2.049-2.764.509-3.479-.674-3.699-1.292-.124-.317-.66-1.293-1.127-1.554-.385-.207-.936-.715-.014-.729.866-.014 1.485.797 1.691 1.128.99 1.663 2.571 1.196 3.204.907.096-.715.385-1.196.701-1.471-2.448-.275-5.005-1.224-5.005-5.432 0-1.196.426-2.186 1.128-2.956-.11-.275-.495-1.402.11-2.915 0 0 .921-.288 3.025 1.128a10.193 10.193 0 0 1 2.75-.371c.935 0 1.87.123 2.75.371 2.104-1.43 3.025-1.128 3.025-1.128.605 1.513.22 2.64.11 2.915.702.77 1.128 1.747 1.128 2.956 0 4.222-2.571 5.157-5.019 5.432.399.344.743 1.004.743 2.035 0 1.472-.014 2.654-.014 3.025 0 .289.206.632.756.522C19.851 20.979 23 16.854 23 12c0-6.077-4.922-11-11-11Z"/>
        </svg>
      </a>
    </nav>
  </header>
  <main class="catalog">
    <section class="intro">
      <h1>Your web arcade</h1>
      <p>Play in your browser with a keyboard, gamepad or touch controls.</p>
    </section>
    <section aria-labelledby="games-heading">
      <h2 id="games-heading">Games</h2>
      <div class="grid" id="games"></div>
    </section>
    <section class="imports" aria-labelledby="add-heading">
      <h2 id="add-heading">Add by URL</h2>
      <form id="add-game">
        <label for="game-url">Game page URL</label>
        <div class="form-row">
          <input id="game-url" name="url" type="url" required placeholder="https://example.com/game/">
          <button type="submit">Add</button>
        </div>
        <p id="import-status" role="status"></p>
      </form>
    </section>
  </main>
  <footer><a href="https://github.com/carlosalbaladejo/link-arcade/blob/main/spec/game-compatibility.md">Create your own games</a></footer>
</body>
</html>
