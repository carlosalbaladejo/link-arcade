<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Play · Link Arcade</title>
  <link rel="stylesheet" href="./arcade.css">
  <script type="module" src="./play.js"></script>
</head>
<body class="player">
  <header class="top">
    <a class="brand" href="./">← Catalog</a>
    <span id="playing"></span>
    <button id="touch-toggle" aria-controls="touch-controls" aria-pressed="false" hidden>Touch controls</button>
  </header>
  <main class="play-area">
    <p id="play-status" role="status">Loading game…</p>
    <iframe id="game" title="Game" allow="autoplay" hidden></iframe>
    <div id="touch-controls" aria-label="Touch controls" hidden></div>
  </main>
</body>
</html>
